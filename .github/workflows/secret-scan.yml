name: secret-scan

# 秘密情報（APIキー / OAuthトークン / パスワード等）の新規混入を止めるゲート。
# 過去の履歴は据え置き、PR/push が新しく足したコミット範囲だけを走査する。
# repo_security_auditor.py が配布する標準ワークフロー。

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（全履歴）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks を取得
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: 新規コミットだけを走査
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT" = "push" ]; then
            if [ "$PUSH_BEFORE" = "$ZERO" ]; then
              RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
            else
              RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "scan range: $RANGE"
          ./gitleaks detect --source . --redact --config .gitleaks.toml \
            --log-opts="$RANGE" --verbose --exit-code 1
